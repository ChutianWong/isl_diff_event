[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosr"
version = "0.1.0.dev0"
description = "Event and frame reconstruction for transport-induced differential sensing"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "matplotlib", "PyYAML", "scikit-image", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
